<!DOCTYPE html>
<html lang="en" data-starting>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Editor</title>
    <meta name="color-scheme" content="light dark" />
    <style>
      html { background: #f3f3f1; color-scheme: light; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme]) { background: #191b1a; color-scheme: dark; }
      }
      html[data-theme="dark"] { background: #191b1a; color-scheme: dark; }
      html[data-starting] #app-root { visibility: hidden; }
    </style>
    <script>
      (() => {
        let saved;
        try { saved = localStorage.getItem("pdf_editor_theme"); } catch {}
        document.documentElement.dataset.theme = saved === "light" || saved === "dark"
          ? saved
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      })();
    </script>
    <link rel="stylesheet" href="/src/styles/app.css" />
  </head>
  <body>
    <div id="app-root">
      <!-- Top Application Header -->
      <header id="app-header" class="app-header" role="banner"></header>

      <!-- Secondary Slim Action Toolbar -->
      <nav id="action-toolbar" style="display: none" class="action-toolbar" role="toolbar" aria-label="Editor Tools"></nav>

      <!-- Main Workspace (Three-panel layout) -->
      <main class="main-workspace" role="main">
        <!-- Left Thumbnail Rail -->
        <aside id="thumbnail-rail" class="thumbnail-rail" aria-label="Page Thumbnails"></aside>

        <!-- Center Canvas Viewport -->
        <section id="canvas-viewport" class="canvas-viewport" aria-label="Document Canvas"></section>

        <!-- Right Properties Panel -->
        <aside id="properties-panel" class="properties-panel" aria-label="Tool Properties"></aside>

        <!-- Empty State Dropzone Overlay (when no file is open) -->
        <div id="empty-state-container"></div>
      </main>

      <!-- Status Bar -->
      <footer id="status-bar" class="status-bar" role="contentinfo">
        <span id="status-page-info">Ready</span>
        <div id="status-zoom-controls" class="status-zoom-controls" hidden>
          <button type="button" class="status-zoom-btn" id="btn-zoom-out"></button>
          <button type="button" class="status-zoom-label" id="status-zoom-info" title="Click to adjust zoom">100%</button>
          <button type="button" class="status-zoom-btn" id="btn-zoom-in"></button>
        </div>
      </footer>
    </div>

    <div id="document-loading" class="document-loading" hidden>
      <p role="status"></p>
    </div>

    <!-- Application Script -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
