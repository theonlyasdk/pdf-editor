[package]
name = "pdf-core"
version = "0.1.0"
edition = "2021"
description = "Pure Rust core PDF engine for pdf-editor with zero Tauri dependency"

[dependencies]
lopdf = { version = "0.47", features = ["rayon", "chrono"] }
pdfium-render = { version = "0.9.6", features = ["image_025", "thread_safe"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
rayon = "1.10"
parking_lot = "0.12"
lru = "0.13"
base64 = "0.22"

[dev-dependencies]
tempfile = "3.17"
